name: Release

on:
  workflow_dispatch:

env:
  VERSION: '0.20.2'

permissions:
  contents: write

jobs:
  build:
    name: Release
    runs-on: ubuntu-latest

    env:
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
      SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: 25
          distribution: temurin

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Bump Version
        uses: chkfung/android-version-actions@v1.1
        with:
          gradlePath: app/build.gradle.kts
          versionCode: ${{ github.run_number }}
          versionName: v${{ env.VERSION }}.${{ github.run_number }}

      - name: Build release APK
        run: ./gradlew assembleRelease -PSIGNING_KEY_ALIAS=$SIGNING_KEY_ALIAS -PKEYSTORE_PASSWORD=$KEYSTORE_PASSWORD -PKEYSTORE_FILE=app/key -PSIGNING_KEY_PASSWORD=$SIGNING_KEY_PASSWORD

      - name: Upload Release APKs to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-apks
          path: app/build/outputs/apk/release/*.apk

      - name: Rename APKs for Release
        id: renameApks
        run: |
          mkdir -p release_assets
          for apk in app/build/outputs/apk/release/*.apk; do
            filename=$(basename "$apk")
            if [[ "$filename" == *"arm64-v8a"* ]]; then
              cp "$apk" "release_assets/Hakoen_v${{ env.VERSION }}.${{ github.run_number }}_arm64-v8a.apk"
            elif [[ "$filename" == *"armeabi-v7a"* ]]; then
              cp "$apk" "release_assets/Hakoen_v${{ env.VERSION }}.${{ github.run_number }}_armeabi-v7a.apk"
            else
              cp "$apk" "release_assets/Hakoen_v${{ env.VERSION }}.${{ github.run_number }}_$filename"
            fi
          done

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}.${{ github.run_number }}
          name: v${{ env.VERSION }}.${{ github.run_number }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: release_assets/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
